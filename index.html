<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Budget Planner | Elegant Finance Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    /* Glassmorphism container */
    .app-container {
      max-width: 1300px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(0px);
      border-radius: 2rem;
      padding: 2rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.5);
      transition: all 0.2s ease;
    }

    /* header area */
    .header-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(120deg, #1e293b, #2d4a6e);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    h1::before {
      content: "💰";
      font-size: 2rem;
      background: none;
      -webkit-background-clip: unset;
      color: #2c5f8a;
    }

    h2, h3 {
      font-weight: 600;
      color: #0f2b3b;
      margin-bottom: 1rem;
      font-size: 1.4rem;
      letter-spacing: -0.2px;
      display: inline-block;
      background: linear-gradient(to right, #1e293b, #334155);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      border-left: 4px solid #3b82f6;
      padding-left: 0.9rem;
    }

    /* summary cards */
    .summary-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .card {
      flex: 1 1 210px;
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 1.3rem 1.2rem;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.02);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.12);
      border-color: #b9d4ff;
    }

    .card-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 700;
      color: #5b6e8c;
      margin-bottom: 0.6rem;
      letter-spacing: 1px;
    }

    .card-value {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      word-break: break-word;
    }

    .income-val { color: #0f7b3a; }
    .expense-val { color: #dc2626; }
    .balance-val { color: #2563eb; }
    .money-left { color: #0f766e; }

    /* starting money panel */
    .starting-panel {
      background: linear-gradient(115deg, #f8fafd 0%, #ffffff 100%);
      border-radius: 1.5rem;
      padding: 1.2rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 1rem;
      border: 1px solid #e0edff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 2 1 220px;
    }

    .input-group label {
      font-weight: 700;
      font-size: 0.75rem;
      color: #334155;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    input, select, button {
      border-radius: 60px;
      border: 1px solid #cbd5e1;
      padding: 0.7rem 1.2rem;
      font-size: 0.9rem;
      transition: all 0.2s;
      background: white;
      font-weight: 500;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }

    button {
      background: #1e4a6e;
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      padding: 0.7rem 1.5rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: 0.15s;
    }

    button:hover {
      background: #0f3a57;
      transform: scale(0.97);
    }

    .btn-outline {
      background: white;
      color: #1e4a6e;
      border: 1px solid #b9d4ff;
    }

    .btn-outline:hover {
      background: #eef4ff;
      transform: scale(0.97);
    }

    /* form row */
    .form-card {
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 1.3rem 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid #e9f0fa;
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.05);
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }

    /* transaction table */
    .table-header-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin: 0.5rem 0 1rem 0;
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
      background: #f1f5f9;
      padding: 0.3rem;
      border-radius: 60px;
    }

    .filter-btn {
      background: transparent;
      color: #334155;
      padding: 0.4rem 1.2rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 40px;
      box-shadow: none;
    }

    .filter-btn.active {
      background: #ffffff;
      color: #1e4a6e;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .filter-btn:hover {
      background: #e2e8f0;
      transform: none;
    }

    .table-wrapper {
      overflow-x: auto;
      margin: 0.5rem 0 1.8rem 0;
      border-radius: 1.25rem;
      background: white;
      border: 1px solid #eef2f8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      text-align: left;
      padding: 1rem 1rem;
      background: #fafcff;
      font-weight: 700;
      color: #1e2f3c;
      border-bottom: 1px solid #e2edf2;
    }

    td {
      padding: 1rem 1rem;
      border-bottom: 1px solid #f0f2f5;
      color: #1e293b;
      font-weight: 500;
    }

    tr:hover td {
      background-color: #fafdff;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0.25rem 0.9rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .badge-income {
      background: #e3f9ed;
      color: #0a6b3e;
    }

    .badge-income::before {
      content: "↑";
      font-weight: bold;
    }

    .badge-expense {
      background: #fee9e7;
      color: #b91c1c;
    }

    .badge-expense::before {
      content: "↓";
      font-weight: bold;
    }

    .delete-btn {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      color: #94a3b8;
      padding: 0.3rem 0.8rem;
      border-radius: 30px;
      transition: all 0.1s;
      font-weight: 600;
    }

    .delete-btn:hover {
      color: #e11d48;
      background: #fff0f0;
      transform: scale(0.95);
    }

    .empty-row td {
      text-align: center;
      color: #94a3b8;
      padding: 2rem;
      font-style: italic;
    }

    /* footer */
    .footer-note {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.7rem;
      color: #6c86a3;
      border-top: 1px solid #e2edf2;
      padding-top: 1.2rem;
    }

    /* responsive */
    @media (max-width: 680px) {
      body {
        padding: 1rem;
      }
      .app-container {
        padding: 1.2rem;
      }
      .card-value {
        font-size: 1.4rem;
      }
      .form-row {
        flex-direction: column;
        align-items: stretch;
      }
      button {
        width: 100%;
      }
      .filter-group {
        margin-top: 0.5rem;
      }
    }

    /* subtle animations */
    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card, .form-card, .starting-panel {
      animation: fadeSlide 0.3s ease-out;
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header-section">
    <h1>Budget Planner</h1>
    <div style="font-size: 0.8rem; color: #4b6b8f;">✨ live balance · smart tracker</div>
  </div>

  <!-- Starting Money Card -->
  <div class="starting-panel">
    <div class="input-group">
      <label>💰 Starting Money</label>
      <input type="number" id="startingMoneyInput" placeholder="e.g., 2500" step="any" value="1000">
    </div>
    <button id="setStartingMoneyBtn">Set Starting Money</button>
  </div>

  <!-- Add Transaction Section -->
  <div class="form-card">
    <h2>➕ Add Transaction</h2>
    <div class="form-row">
      <div class="input-group" style="flex: 2;">
        <label>Description</label>
        <input type="text" id="descInput" placeholder="Salary, Groceries, Rent...">
      </div>
      <div class="input-group" style="flex: 1;">
        <label>Amount ($)</label>
        <input type="number" id="amountInput" placeholder="0.00" step="any">
      </div>
      <div class="input-group" style="flex: 1;">
        <label>Type</label>
        <select id="typeSelect">
          <option value="income">Income 💵</option>
          <option value="expense">Expense 💸</option>
        </select>
      </div>
      <button id="addTransactionBtn">+ Add Transaction</button>
    </div>
  </div>

  <!-- Transaction List with Filters -->
  <div class="table-header-tools">
    <h2>📋 Transactions</h2>
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="income">Income</button>
      <button class="filter-btn" data-filter="expense">Expense</button>
    </div>
  </div>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr><th>Description</th><th>Amount</th><th>Type</th><th style="width: 80px;">Action</th></tr>
      </thead>
      <tbody id="transactionList"></tbody>
    </table>
  </div>

  <!-- Summary Cards -->
  <h2>📈 Summary</h2>
  <div class="summary-grid">
    <div class="card"><div class="card-label">Total Income</div><div class="card-value income-val" id="totalIncome">$0.00</div></div>
    <div class="card"><div class="card-label">Total Expense</div><div class="card-value expense-val" id="totalExpense">$0.00</div></div>
    <div class="card"><div class="card-label">Balance</div><div class="card-value balance-val" id="balance">$0.00</div></div>
    <div class="card"><div class="card-label">Money Left</div><div class="card-value money-left" id="moneyLeft">$0.00</div></div>
  </div>
  <div class="footer-note">
    💾 All data saved locally · Your finances stay private
  </div>
</div>

<script>
  // ---------- STATE ----------
  let transactions = [];
  let startingMoney = 1000;     // default $1000
  let currentFilter = 'all';

  // ---------- DOM elements ----------
  const startingMoneyInput = document.getElementById('startingMoneyInput');
  const setStartingMoneyBtn = document.getElementById('setStartingMoneyBtn');
  const descInput = document.getElementById('descInput');
  const amountInput = document.getElementById('amountInput');
  const typeSelect = document.getElementById('typeSelect');
  const addTransactionBtn = document.getElementById('addTransactionBtn');
  const transactionListEl = document.getElementById('transactionList');
  const totalIncomeEl = document.getElementById('totalIncome');
  const totalExpenseEl = document.getElementById('totalExpense');
  const balanceEl = document.getElementById('balance');
  const moneyLeftEl = document.getElementById('moneyLeft');
  const filterBtns = document.querySelectorAll('.filter-btn');

  // ---------- Helper: escape HTML ----------
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // ---------- Load from localStorage ----------
  function loadData() {
    const savedTransactions = localStorage.getItem('transactions');
    if (savedTransactions) {
      transactions = JSON.parse(savedTransactions);
    }
    const savedStartingMoney = localStorage.getItem('startingMoney');
    if (savedStartingMoney !== null) {
      startingMoney = parseFloat(savedStartingMoney);
      if (isNaN(startingMoney)) startingMoney = 0;
    } else {
      startingMoney = 1000;
    }
    startingMoneyInput.value = startingMoney;
  }

  // Save to localStorage
  function saveTransactions() {
    localStorage.setItem('transactions', JSON.stringify(transactions));
  }

  function saveStartingMoney() {
    localStorage.setItem('startingMoney', startingMoney);
  }

  // Update summary values
  function updateSummary() {
    let totalIncome = 0;
    let totalExpense = 0;
    for (let t of transactions) {
      if (t.type === 'income') totalIncome += t.amount;
      else totalExpense += t.amount;
    }
    const balance = totalIncome - totalExpense;
    const moneyLeft = startingMoney + balance;

    totalIncomeEl.textContent = `$${totalIncome.toFixed(2)}`;
    totalExpenseEl.textContent = `$${totalExpense.toFixed(2)}`;
    balanceEl.textContent = `$${balance.toFixed(2)}`;
    moneyLeftEl.textContent = `$${moneyLeft.toFixed(2)}`;
  }

  // Render transaction table (with filter)
  function renderTransactions() {
    let filtered = [...transactions];
    if (currentFilter === 'income') {
      filtered = transactions.filter(t => t.type === 'income');
    } else if (currentFilter === 'expense') {
      filtered = transactions.filter(t => t.type === 'expense');
    }

    if (filtered.length === 0) {
      transactionListEl.innerHTML = `<tr class="empty-row"><td colspan="4">✨ No transactions yet. Add your first income or expense! ✨</td></tr>`;
      return;
    }

    let rows = '';
    for (let t of filtered) {
      rows += `
        <tr>
          <td><strong>${escapeHtml(t.description)}</strong></td>
          <td>$${t.amount.toFixed(2)}</td>
          <td><span class="badge ${t.type === 'income' ? 'badge-income' : 'badge-expense'}">${t.type === 'income' ? 'Income' : 'Expense'}</span></td>
          <td><button class="delete-btn" data-id="${t.id}">🗑 Delete</button></td>
        </tr>
      `;
    }
    transactionListEl.innerHTML = rows;

    // attach delete events
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(btn.getAttribute('data-id'));
        deleteTransaction(id);
      });
    });
  }

  // Delete transaction
  function deleteTransaction(id) {
    transactions = transactions.filter(t => t.id !== id);
    saveTransactions();
    renderTransactions();
    updateSummary();
  }

  // Add transaction
  function addTransaction() {
    const description = descInput.value.trim();
    let amount = parseFloat(amountInput.value);
    const type = typeSelect.value;

    if (!description) {
      alert('Please enter a description (e.g., Groceries, Freelance)');
      return;
    }
    if (isNaN(amount) || amount <= 0) {
      alert('Amount must be a positive number greater than zero.');
      return;
    }

    const newTransaction = {
      id: Date.now(),
      description: description,
      amount: amount,
      type: type,
    };
    transactions.push(newTransaction);
    saveTransactions();
    renderTransactions();
    updateSummary();

    // reset fields (keep type as is for convenience)
    descInput.value = '';
    amountInput.value = '';
    // optional: focus description for next entry
    descInput.focus();
  }

  // Set starting money
  function setStartingMoney() {
    let newAmount = parseFloat(startingMoneyInput.value);
    if (isNaN(newAmount)) {
      alert('Please enter a valid numeric amount for starting money.');
      return;
    }
    startingMoney = newAmount;
    saveStartingMoney();
    updateSummary();
    // subtle feedback
    const btn = setStartingMoneyBtn;
    const originalText = btn.innerText;
    btn.innerText = '✓ Updated!';
    setTimeout(() => { btn.innerText = originalText; }, 1200);
  }

  // Change active filter
  function setFilter(filter) {
    currentFilter = filter;
    filterBtns.forEach(btn => {
      const btnFilter = btn.getAttribute('data-filter');
      if (btnFilter === filter) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
    renderTransactions();
  }

  // Event binding
  addTransactionBtn.addEventListener('click', addTransaction);
  setStartingMoneyBtn.addEventListener('click', setStartingMoney);
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const filterValue = btn.getAttribute('data-filter');
      setFilter(filterValue);
    });
  });

  // press enter on amount or description?
  const inputs = [descInput, amountInput];
  inputs.forEach(inp => {
    inp.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addTransaction();
      }
    });
  });

  // init
  loadData();
  updateSummary();
  renderTransactions();
</script>
</body>
</html>
