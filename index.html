<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Planner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>📊 Budget Planner</h1>
        
        <div class="card">
            <h3>💰 Starting Money</h3>
            <input type="number" id="startingMoney" placeholder="Enter starting money">
            <button onclick="setStartingMoney()">Set Starting Money</button>
            <p>Current: $<span id="currentMoney">0</span></p>
        </div>

        <div class="card">
            <h3>➕ Add Transaction</h3>
            <input type="text" id="desc" placeholder="Description">
            <input type="number" id="amount" placeholder="Amount">
            <select id="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
            <select id="category">
                <option value="general">General</option>
                <option value="groceries">Groceries</option>
                <option value="bills">Bills</option>
                <option value="entertainment">Entertainment</option>
                <option value="transport">Transport</option>
                <option value="shopping">Shopping</option>
                <option value="health">Health</option>
                <option value="eating out">Eating Out</option>
            </select>
            <button onclick="addTransaction()">Add Transaction</button>
        </div>

        <div class="card">
            <h3>📋 Transactions</h3>
            <div class="filter-buttons">
                <button onclick="filterAll()">All</button>
                <button onclick="filterIncome()">Income</button>
                <button onclick="filterExpense()">Expenses</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Type</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="transactionList"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h3>📈 Summary</h3>
            <div class="summary-grid">
                <div class="summary-item">
                    <span>Total Income:</span>
                    <strong>$<span id="totalIncome">0</span></strong>
                </div>
                <div class="summary-item">
                    <span>Total Expense:</span>
                    <strong>$<span id="totalExpense">0</span></strong>
                </div>
                <div class="summary-item">
                    <span>Balance:</span>
                    <strong>$<span id="balance">0</span></strong>
                </div>
                <div class="summary-item">
                    <span>Money Left:</span>
                    <strong>$<span id="moneyLeft">0</span></strong>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>📊 Spending by Category</h3>
            <div id="categoryBreakdown"></div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
